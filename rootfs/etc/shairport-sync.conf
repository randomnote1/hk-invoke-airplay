// shairport-sync configuration for HK Invoke AirPlay speaker
// See: https://github.com/mikebrady/shairport-sync/blob/master/scripts/shairport-sync.conf

general = {
    // AirPlay service name (visible on iPhone/Mac)
    name = "HK Invoke";

    // Output backend
    output_backend = "alsa";

    // Port for AirPlay 2 (default 7000)
    // port = 7000;

    // Enable AirPlay 2
    // airplay_device_id is auto-generated from MAC address

    // Interpolation for best audio quality
    interpolation = "soxr";

    // Drift tolerance (microseconds)
    drift_tolerance_in_seconds = 0.002;

    // Volume control range in dB (matches softvol range)
    volume_range_db = 60;
};

alsa = {
    // Use the "music" PCM device which routes through softvol → dmix → DSP hw:1
    output_device = "music";

    // The Invoke DSP expects 48000 Hz
    output_rate = 48000;

    // 32-bit signed LE (matches DSP hardware)
    output_format = "S32";

    // Mixer control for volume (softvol "music" on card 0)
    mixer_control_name = "music";
    mixer_device = "hw:0";
};

metadata = {
    // Enable metadata (for cover art, track info, DACP remote control)
    enabled = "yes";

    // Include cover art
    include_cover_art = "yes";

    // Pipe for metadata output
    pipe_name = "/tmp/shairport-sync-metadata";
    pipe_timeout = 5000;
};

diagnostics = {
    // Log level: "warn", "info", "debug"
    log_verbosity = 1;

    // Log to stderr (captured by init logging)
    statistics = "no";
};

sessioncontrol = {
    // Allow session to be taken over by another device
    allow_session_interruption = "yes";

    // Timeout for session recovery (seconds)
    session_timeout = 120;
};
