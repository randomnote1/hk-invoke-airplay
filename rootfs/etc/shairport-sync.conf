// shairport-sync 3.3.x configuration for HK Invoke AirPlay speaker
// Classic AirPlay (AirPlay 1) — Phase 1

general = {
    name = "HK Invoke";
    output_backend = "alsa";

    // Drift tolerance (seconds)
    drift_tolerance_in_seconds = 0.002;

    // Volume control range in dB
    volume_range_db = 60;
};

alsa = {
    // "music" PCM routes through softvol -> dmix -> DSP hw:1
    output_device = "music";
    output_rate = 48000;
    output_format = "S32";

    // Softvol mixer on ALSA card 0
    mixer_control_name = "music";
    mixer_device = "hw:0";
};

metadata = {
    enabled = "yes";
    include_cover_art = "yes";
    pipe_name = "/tmp/shairport-sync-metadata";
    pipe_timeout = 5000;
};

sessioncontrol = {
    allow_session_interruption = "yes";
    session_timeout = 120;
};
